name: Build & Release Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: meta
        run: |
          VERSION=$(node -e "console.log(require('./app.json').expo.version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=nosh-mobile-v${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Configure release keystore & signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/nosh-release.p12
          keytool -list -keystore android/app/nosh-release.p12 -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS"
          cat <<'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file("nosh-release.p12")
                      storeType "PKCS12"
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Verify APK signature & stage output
        id: apk
        run: |
          RAW_APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RAW_APK" ]; then
            echo "Built APK not found at $RAW_APK" >&2
            find android/app/build/outputs -maxdepth 5
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$RAW_APK"
          fi
          OUT_APK="${{ steps.meta.outputs.apk_name }}"
          cp "$RAW_APK" "$OUT_APK"
          BYTES=$(wc -c < "$OUT_APK")
          echo "size_bytes=$BYTES" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nosh-mobile-apk
          path: ${{ steps.meta.outputs.apk_name }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          APK="${{ steps.meta.outputs.apk_name }}"
          NOTES="Nosh Mobile ${TAG} for Android (arm64-v8a, armeabi-v7a)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Nosh Mobile ${TAG} (Android APK)" --notes "$NOTES"
          fi
